<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProjectDeployer 缓存更新</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: #e5e7ef;
      background: #101116;
      font: 16px system-ui, sans-serif;
    }
    main { text-align: center; padding: 32px; }
  </style>
</head>
<body>
  <main>
    <h1>正在更新 ProjectDeployer</h1>
    <p id="status">正在清理旧版离线缓存……</p>
  </main>
  <script>
    async function resetProjectDeployerCache() {
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map((registration) => registration.unregister()));
      }
      if ('caches' in window) {
        const names = await caches.keys();
        await Promise.all(names.map((name) => caches.delete(name)));
      }
      document.getElementById('status').textContent = '缓存已清理，正在打开新版管理台……';
      window.location.replace('/?cache-reset=' + Date.now());
    }

    resetProjectDeployerCache().catch((error) => {
      document.getElementById('status').textContent = '缓存清理失败：' + error;
    });
  </script>
</body>
</html>
